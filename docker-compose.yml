services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agua}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agua}
      POSTGRES_DB: ${POSTGRES_DB:-agua_lluvia}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agua} -d ${POSTGRES_DB:-agua_lluvia}"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agua}:${POSTGRES_PASSWORD:-agua}@db:5432/${POSTGRES_DB:-agua_lluvia}
      CLAVE_UNICA: ${CLAVE_UNICA:-cambiar-esta-clave}
      LLM_API_KEY: ${LLM_API_KEY:-}
      DATA_DIR: /data
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:

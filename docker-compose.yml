services:
  db:
    image: postgis/postgis:16-3.4
    container_name: agua_lluvia_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agua}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agua}
      POSTGRES_DB: ${POSTGRES_DB:-agua_lluvia}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agua} -d ${POSTGRES_DB:-agua_lluvia}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
